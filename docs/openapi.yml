openapi: 3.0.0
info:
  version: 1.0.0
  title: Payment Orchestration Engine API
  description: API documentation for the Payment Orchestration Engine
servers:
  - url: /
paths:
  /payments/initiate:
    post:
      tags:
        - Payments
      summary: Initiate a payment
      parameters:
        - name: idempotency-key
          in: header
          required: true
          description: "A unique, client-generated identifier (like a UUID) to prevent duplicate payments."
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
                - method
                - orderId
                - customer
              properties:
                amount:
                  type: number
                  example: 100
                method:
                  type: string
                  enum:
                    - card
                    - netbanking
                    - wallet
                    - emi
                    - upi
                  example: upi
                orderId:
                  type: string
                  example: order_12345
                customer:
                  type: object
                  required:
                    - id
                    - phone
                  properties:
                    id:
                      type: string
                      example: cust_123
                    phone:
                      type: string
                      example: "9876543210"
                    email:
                      type: string
                      format: email
                      example: user@example.com
      responses:
        "200":
          description: Payment initiated successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                  - data
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    required:
                      - paymentId
                      - orderId
                      - gateway
                      - paymentMethod
                    properties:
                      paymentId:
                        type: string
                      orderId:
                        type: string
                      gateway:
                        type: string
                      paymentLink:
                        type: string
                      keyId:
                        type: string
                      paymentMethod:
                        type: string
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /payments/{id}:
    get:
      tags:
        - Payments
      summary: Get payment details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        "200":
          description: Payment details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - message
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
  /webhooks/razorpay:
    post:
      tags:
        - Webhooks
      summary: Razorpay Webhook
      description: Endpoint for receiving Razorpay payment webhooks.
      parameters:
        - name: x-razorpay-signature
          in: header
          required: true
          schema:
            type: string
        - name: x-razorpay-event-id
          in: header
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  /webhooks/cashfree:
    post:
      tags:
        - Webhooks
      summary: Cashfree Webhook
      description: Endpoint for receiving Cashfree payment webhooks.
      parameters:
        - name: x-webhook-signature
          in: header
          required: true
          schema:
            type: string
        - name: x-webhook-timestamp
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Webhook processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  /refunds:
    post:
      tags:
        - Refunds
      summary: Initiate a refund
      description: Initiates a full or partial refund for a successful payment.
      parameters:
        - name: idempotency-key
          in: header
          required: true
          description: "A unique identifier (like a UUID) to prevent duplicate refunds."
          schema:
            type: string
            example: "test_refund_key_101"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentId
                - amountInRupees
              properties:
                paymentId:
                  type: string
                  format: uuid
                  example: "a3b39835-a96d-4752-ac18-edeca4d1497c"
                amountInRupees:
                  type: number
                  minimum: 0.01
                  example: 100
                reason:
                  type: string
                  example: "Customer requested return"
      responses:
        "201":
          description: Refund initiated and processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Refund'
        "200":
          description: Idempotent replay - refund was already processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Request has already been processed. Returning the existing refund"
                  data:
                    $ref: '#/components/schemas/Refund'
        "400":
          description: Invalid request, amount exceeds balance, or invalid payment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        "404":
          description: Payment not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /refunds/{id}:
    get:
      tags:
        - Refunds
      summary: Get refund by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "a34a4f2b-6219-4365-9b37-118e0c7e193b"
      responses:
        "200":
          description: Refund retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Refund'
        "404":
          description: Refund not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /refunds/payment/{paymentId}:
    get:
      tags:
        - Refunds
      summary: Get all refunds for a payment
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            example: "a3b39835-a96d-4752-ac18-edeca4d1497c"
      responses:
        "200":
          description: List of refunds for the payment
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Refund'
  /health:
    get:
      tags:
        - System
      summary: Health Check
      description: Endpoint to check if the server is running.
      responses:
        "200":
          description: Server is healthy
          content:
            text/plain:
              schema:
                type: string
                example: ok
components:
  schemas:
    Refund:
      type: object
      properties:
        refundId:
          type: string
          format: uuid
          example: "a34a4f2b-6219-4365-9b37-118e0c7e193b"
        paymentId:
          type: string
          format: uuid
          example: "a3b39835-a96d-4752-ac18-edeca4d1497c"
        gateway:
          type: string
          enum: [razorpay, cashfree]
          example: "cashfree"
        gatewayRefundId:
          type: string
          nullable: true
          example: "1319938666"
        amountInRupees:
          type: number
          example: 100
        status:
          type: string
          enum: [pending, processed, failed]
          example: "processed"
        reason:
          type: string
          nullable: true
          example: "Customer requested return"
        createdAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Error message"
        errorCode:
          type: string
          example: "ERROR_CODE"
    ValidationError:
      type: object
      required:
        - success
        - message
        - errorCode
        - errors
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Validation failed
        errorCode:
          type: string
          example: VALIDATION_ERROR
        errors:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
                example: customer.phone
              message:
                type: string
                example: "Invalid input: expected string, received number"
